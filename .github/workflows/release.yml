name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Release builds must not reuse state written by other branches/tags.
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Lint, test and build signed release
        env:
          HOMESCREENER_KEYSTORE: ${{ runner.temp }}/release.jks
          HOMESCREENER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HOMESCREENER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HOMESCREENER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lint test assembleRelease

      - name: Verify signature and prepare assets
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          "$apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" "dist/homescreener-$TAG.apk"
          (cd dist && sha256sum "homescreener-$TAG.apk" > "homescreener-$TAG.apk.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
